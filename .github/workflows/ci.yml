name: CI Pipeline

permissions:
  contents: write
  packages: write

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      # 1. Repository auschecken
      - name: Checkout Code
        uses: actions/checkout@v7

      # 2. Python 3.12 einrichten mit pip Caching
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "uv"

      # 3. uv installieren
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      # 4 Abhängigkeiten installieren
      - name: Install Dependencies
        run: uv sync --frozen

      # 5. Ruff ausführen und Code automatisch formatieren
      - name: Run Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # 6. Pytest ausführen
      - name: Run Pytest
        run: uv run pytest

  build-docker:
    name: Build and push Docker Image
    needs: lint-and-test
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Buildx für effizientes Bauen einrichten
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/ayano590/vienna-data-platform
          tags: |
            type=raw,value=latest
            type=sha

      # 7. Docker Image bauen und pushen
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}