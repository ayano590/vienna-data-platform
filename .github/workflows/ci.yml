name: CI Pipeline

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      # 1. Repository auschecken
      - name: Checkout Code
        uses: actions/checkout@main

      # 2. Python 3.14 einrichten mit pip Caching
      - name: Set up Python 3.14
        uses: actions/setup-python@main
        with:
          python-version: "3.14"
          cache: "pip"

      # 3. Dependencies installieren
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Ruff ausführen (Linter & Formatter Check)
      - name: Run Ruff
        run: |
          ruff check .
          ruff format --check .

      # 5. Pytest ausführen
      - name: Run Pytest
        run: |
          pytest

  build-docker:
    name: Build Docker Image
    needs: lint-and-test
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout Code
        uses: actions/checkout@main

      # Docker Buildx für effizientes Bauen einrichten
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@main

      # 6. Docker Image bauen (ohne Registry Push)
      - name: Build Docker Image
        uses: docker/build-push-action@main
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: vienna-data-platform:latest