[project]
name = "vienna-data-platform"
version = "0.1.0"
description = "Data engineering platform for Vienna mobility and event data"
readme = "README.md"
authors = [
    { name = "ayano", email = "aram.sajdak@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "prefect>=3.8.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
]

[tool.ruff]
line-length = 100
target-version = "py312"
